<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闪卡复习 - Stat-Lab</title>
  <link rel="stylesheet" href="../shared/css/variables-warm.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/pages.css">
  <link rel="stylesheet" href="../shared/css/responsive.css">
  <link rel="stylesheet" href="../shared/vendor/katex.min.css">
  <style>
    .filter-bar { text-align:center; margin-bottom:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .filter-bar select { padding:8px 16px; border:1px solid var(--border-solid); border-radius:var(--radius-sm); background:var(--bg-input); font-size:0.9rem; color:var(--text-primary); cursor:pointer; }
    .filter-bar select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,0.1); }
  </style>
</head>
<body>

  <main class="page-container narrow">
    <div class="page-header">
      <h2>闪卡复习</h2>
      <p style="color:var(--text-secondary);font-size:0.85rem;">温习经济统计术语与公式 · 点击卡片翻转查看</p>
    </div>

    <div class="filter-bar">
      <select id="subject-filter" onchange="changeFilter()">
        <option value="all">全部学科</option>
      </select>
      <select id="chapter-filter" onchange="changeFilter()">
        <option value="all">全部章节</option>
      </select>
    </div>

    <div id="flashcard-container">
      <div style="text-align:center;padding:64px;color:var(--text-secondary);">加载卡片中...</div>
    </div>
  </main>

  <script src="../shared/js/storage.js"></script>
  <script src="../shared/js/router.js"></script>
  <script src="../subjects/econstats/data/glossary.js"></script>
  <script src="../shared/vendor/katex.min.js"></script>
  <script src="../shared/vendor/auto-render.min.js"></script>
  <script src="../shared/js/flashcard-engine.js"></script>
  <script>
    injectNavbar('flashcards');

    function populateSubjectFilter() {
      var sel = document.getElementById('subject-filter');
      if (typeof SUBJECT_REGISTRY === 'undefined') return;
      var html = '<option value="all">全部学科</option>';
      for (var i = 0; i < SUBJECT_REGISTRY.length; i++) {
        var s = SUBJECT_REGISTRY[i];
        html += '<option value="' + s.id + '">' + s.icon + ' ' + s.name + '</option>';
      }
      sel.innerHTML = html;
    }

    function populateChapterFilter(subjectId) {
      var sel = document.getElementById('chapter-filter');
      var chapters = [];
      if (subjectId === 'all') {
        if (typeof SUBJECT_REGISTRY !== 'undefined') {
          for (var s = 0; s < SUBJECT_REGISTRY.length; s++) {
            chapters = chapters.concat(SUBJECT_REGISTRY[s].chapters);
          }
        }
      } else {
        if (typeof SUBJECT_REGISTRY !== 'undefined') {
          for (var s = 0; s < SUBJECT_REGISTRY.length; s++) {
            if (SUBJECT_REGISTRY[s].id === subjectId) {
              chapters = SUBJECT_REGISTRY[s].chapters;
              break;
            }
          }
        }
      }
      var html = '<option value="all">全部章节</option>';
      for (var c = 0; c < chapters.length; c++) {
        html += '<option value="' + chapters[c].id + '">' + chapters[c].icon + ' ' + chapters[c].title + '</option>';
      }
      sel.innerHTML = html;
    }

    function changeFilter() {
      var subject = document.getElementById('subject-filter').value;
      var chapter = document.getElementById('chapter-filter').value;
      populateChapterFilter(subject);
      FlashcardEngine.init(chapter, subject);
    }

    populateSubjectFilter();
    populateChapterFilter('all');
    FlashcardEngine.init('all', 'all');

    document.getElementById('subject-filter').addEventListener('change', function() {
      populateChapterFilter(this.value);
    });
  </script>
</body>
</html>
