<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经济统计学 - Stat-Lab</title>
<link rel="stylesheet" href="../../shared/css/variables-warm.css">
<link rel="stylesheet" href="../../shared/css/base.css">
<link rel="stylesheet" href="../../shared/css/components.css">
<link rel="stylesheet" href="../../shared/css/pages.css">
<link rel="stylesheet" href="../../shared/css/responsive.css">
</head>
<body>
<main>
  <div class="subject-hero">
    <span class="hero-icon">&#128200;</span>
    <h1>经济统计学</h1>
    <p>8 章节 · GDP核算、价格指数、产业统计、数据资产</p>
  </div>
  <div id="chapter-grid" class="chapter-grid"></div>
</main>
<script src="../../shared/js/storage.js"></script>
<script src="../../shared/js/router.js"></script>
<script>
(function() {
  var subject = SUBJECT_REGISTRY[0];
  var cardsHtml = '';
  for (var c = 0; c < subject.chapters.length; c++) {
    var ch = subject.chapters[c];
    cardsHtml += '' +
      '<div class="chapter-card" style="animation-delay:' + (c * 60) + 'ms;">' +
        '<span class="ch-icon">' + ch.icon + '</span>' +
        '<h3>' + ch.title + '</h3>' +
        '<div class="ch-desc">第 ' + (c + 1) + ' 章</div>' +
        '<div class="ch-links">' +
          '<a href="knowledge/' + ch.id + '.html" class="btn">知识点</a>' +
          '<a href="quiz/' + ch.id + '.html" class="btn btn-primary">测验</a>' +
        '</div>' +
      '</div>';
  }
  cardsHtml += '' +
    '<div class="extra-card" style="animation-delay:' + ((c + 1) * 60) + 'ms;">' +
      '<span class="card-icon">&#128202;</span>' +
      '<h3>计算器</h3>' +
      '<p>价格指数、GDP换算、增长率</p>' +
      '<div class="ch-links"><a href="calculators/index.html" class="btn btn-primary">打开</a></div>' +
    '</div>';
  document.getElementById('chapter-grid').innerHTML = cardsHtml;
  injectNavbar('subject-home', 'econstats');
})();
</script>
</body>
</html>
