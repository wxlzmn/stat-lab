<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验 - Stat-Lab</title>
<link rel="stylesheet" href="../../../shared/css/variables-warm.css">
<link rel="stylesheet" href="../../../shared/css/base.css">
<link rel="stylesheet" href="../../../shared/css/components.css">
<link rel="stylesheet" href="../../../shared/css/pages.css">
<link rel="stylesheet" href="../../../shared/css/responsive.css">
</head>
<body>
<main>
  <div class="lab-page-hero">
    <h1>代码实验室</h1>
    <p>交互式算法实验 —— 拖动滑块，实时观察算法行为</p>
  </div>
  <div id="lab-grid" class="chapter-grid"></div>
</main>
<script src="../../../shared/js/storage.js"></script>
<script src="../../../shared/js/router.js"></script>
<script>
(function() {
  var labs = [
    { id: 's5-optimize', title: '梯度下降', icon: '📉', desc: '交互式梯度下降路径可视化。调整学习率、起始点和函数类型，观察收敛过程。' },
    { id: 's6-supervised', title: '线性回归', icon: '🎯', desc: 'OLS、Ridge 和 Lasso 回归对比。拖动滑块调整样本量、噪声和正则化参数。' },
    { id: 's7-tree', title: '决策树', icon: '🌳', desc: '一步步构建决策边界。切换数据模式，调整树深度，直观理解过拟合。' }
  ];
  var subject = SUBJECT_REGISTRY[1];

  var cardsHtml = '';
  for (var i = 0; i < labs.length; i++) {
    var lab = labs[i];
    cardsHtml += '' +
      '<div class="chapter-card" style="animation-delay:' + (i * 60) + 'ms;">' +
        '<span class="ch-icon">' + lab.icon + '</span>' +
        '<h3>' + lab.title + '</h3>' +
        '<div class="ch-desc">' + lab.desc + '</div>' +
        '<div class="ch-links">' +
          '<a href="' + lab.id + '.html" class="btn btn-primary">打开实验</a>' +
          '<a href="../knowledge/' + lab.id + '.html" class="btn">知识点</a>' +
        '</div>' +
      '</div>';
  }
  document.getElementById('lab-grid').innerHTML = cardsHtml;
  injectNavbar('lab', 'stat-comp');
})();
</script>
</body>
</html>
