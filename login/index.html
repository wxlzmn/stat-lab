<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Stat-Lab</title>
  <link rel="stylesheet" href="../shared/css/variables-warm.css">
  <link rel="stylesheet" href="../shared/css/variables-academic.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/pages.css">
  <link rel="stylesheet" href="../shared/css/responsive.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - var(--navbar-height) - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin-top: var(--navbar-height);
    }
    .auth-card {
      background: var(--bg-card);
      border: 2px dashed var(--border-dashed);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }
    .auth-card h2 {
      font-family: var(--font-display);
      text-align: center;
      color: var(--text-primary);
      margin: 0 0 4px 0;
      font-size: 1.5rem;
    }
    .auth-card .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #fde68a;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fffbeb;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
    }
    .btn-auth {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: all 0.2s;
    }
    .btn-auth:hover {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .btn-auth:disabled {
      opacity: 0.6;
      cursor: default;
      filter: none;
      box-shadow: none;
    }
    .auth-switch {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .auth-switch a {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .auth-switch a:hover {
      text-decoration: underline;
    }
    .auth-msg {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }
    .auth-msg.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .auth-msg.success {
      display: block;
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }
    .auth-card .mode-indicator {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-top: 16px;
      padding: 8px;
      background: #fffdf5;
      border-radius: 6px;
      border: 1px dashed #fde68a;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2 id="auth-title">🔐 登录</h2>
      <p class="subtitle" id="auth-subtitle">同步学习进度到云端</p>

      <div id="auth-msg" class="auth-msg"></div>

      <form id="auth-form" onsubmit="return false;">
        <!-- 注册模式才显示 -->
        <div class="form-group" id="email-group" style="display:none;">
          <label for="email">📧 邮箱</label>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="username">👤 用户名</label>
          <input type="text" id="username" placeholder="输入用户名" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">🔒 密码</label>
          <input type="password" id="password" placeholder="输入密码（至少6位）" autocomplete="current-password" required minlength="6">
        </div>

        <button type="submit" class="btn-auth" id="auth-submit">登 录</button>
      </form>

      <div class="auth-switch">
        <span id="switch-text">还没有账号？</span>
        <a id="switch-link" onclick="toggleMode()">立即注册</a>
      </div>

      <div class="mode-indicator">
        ⚡ 当前为离线模式 · 数据保存在本地浏览器
      </div>
    </div>
  </div>

  <script src="../shared/js/storage.js"></script>
  <script src="../shared/js/router.js"></script>
  <script>
    injectNavbar('login');

    var isRegisterMode = false;

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      var emailGroup = document.getElementById('email-group');
      var submitBtn = document.getElementById('auth-submit');
      var switchText = document.getElementById('switch-text');
      var switchLink = document.getElementById('switch-link');
      var title = document.getElementById('auth-title');
      var subtitle = document.getElementById('auth-subtitle');

      if (isRegisterMode) {
        emailGroup.style.display = 'block';
        submitBtn.textContent = '注 册';
        switchText.textContent = '已有账号？';
        switchLink.textContent = '去登录';
        title.textContent = '✨ 注册';
        subtitle.textContent = '创建账号，同步学习数据';
        document.getElementById('email').required = true;
      } else {
        emailGroup.style.display = 'none';
        submitBtn.textContent = '登 录';
        switchText.textContent = '还没有账号？';
        switchLink.textContent = '立即注册';
        title.textContent = '🔐 登录';
        subtitle.textContent = '同步学习进度到云端';
        document.getElementById('email').required = false;
      }
      hideMessage();
    }

    function showMessage(msg, type) {
      var el = document.getElementById('auth-msg');
      el.textContent = msg;
      el.className = 'auth-msg ' + (type || 'error');
    }

    function hideMessage() {
      var el = document.getElementById('auth-msg');
      el.className = 'auth-msg';
      el.textContent = '';
    }

    document.getElementById('auth-form').addEventListener('submit', function () {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var email = document.getElementById('email').value.trim();

      if (!username || !password) {
        showMessage('请填写用户名和密码', 'error');
        return;
      }
      if (password.length < 6) {
        showMessage('密码长度至少6位', 'error');
        return;
      }
      if (isRegisterMode && !email) {
        showMessage('请填写邮箱', 'error');
        return;
      }

      var submitBtn = document.getElementById('auth-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = isRegisterMode ? '注册中...' : '登录中...';
      hideMessage();

      // 离线模式：本地存储用户信息，直接登录
      setTimeout(function () {
        var userData = { username: username, loggedIn: true, mode: 'offline' };
        if (isRegisterMode) userData.email = email;
        localStorage.setItem('statlab_user', JSON.stringify(userData));
        showMessage(
          '离线模式：已作为「' + username + '」登录（数据保存在本地浏览器）',
          'success'
        );
        submitBtn.disabled = false;
        submitBtn.textContent = '已登录 ✓';
        setTimeout(function () {
          window.location.href = '../index.html';
        }, 1500);
      }, 600);
    });

    // 检查是否已登录（离线模式）
    (function () {
      var savedUser = null;
      try {
        savedUser = JSON.parse(localStorage.getItem('statlab_user'));
      } catch (e) { savedUser = null; }
      if (savedUser && savedUser.loggedIn) {
        showMessage('您已登录（离线模式）', 'success');
        document.getElementById('auth-submit').disabled = true;
        document.getElementById('auth-submit').textContent = '已登录 ✓';
        setTimeout(function () {
          window.location.href = '../index.html';
        }, 1500);
      }
    })();

    // Enter 键提交
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('auth-submit').click();
      }
    });
  </script>
</body>
</html>
