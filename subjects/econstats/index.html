<body>
<main>

    <h1 style="color:var(--text-primary);">经济统计学</h1>
    <p style="color:var(--text-muted);font-size:0.9rem;">8 章节 · GDP核算、价格指数、产业统计</p>

<script>
(function() {
  var subject = SUBJECT_REGISTRY[0];
  var cardsHtml = '';
  for (var c = 0; c < subject.chapters.length; c++) {
    var ch = subject.chapters[c];
    cardsHtml += '' +
      '<div class="module-card" style="border-top:2px solid ' + subject.color + ';">' +
        '<span class="card-icon">' + ch.icon + '</span>' +
        '<h3>' + ch.title + '</h3>' +
        '<p>' + ch.title + '</p>' +
        '<div class="card-links">' +
          '<a href="knowledge/' + ch.id + '.html" class="btn">知识点</a>' +
          '<a href="quiz/' + ch.id + '.html" class="btn btn-primary">测验</a>' +
        '</div>' +
      '</div>';
  }
  cardsHtml += '' +
    '<div class="module-card" style="border-top:2px solid ' + subject.color + ';">' +
      '<span class="card-icon">🧮</span><h3>计算器</h3><p>价格指数、GDP换算、增长率</p>' +
      '<div class="card-links"><a href="calculators/index.html" class="btn btn-primary">打开</a></div>' +
    '</div>';
  document.getElementById('chapter-grid').innerHTML = cardsHtml;
  injectNavbar('subject-home', 'econstats');
})();
</script>
