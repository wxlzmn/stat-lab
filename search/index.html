<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 - Stat-Lab</title>
  <link rel="stylesheet" href="../shared/css/variables-warm.css">
  <link rel="stylesheet" href="../shared/css/variables-academic.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/pages.css">
  <link rel="stylesheet" href="../shared/css/responsive.css">
  <style>
    .search-hero { text-align:center; padding:40px 20px 30px; }
    .search-hero input { width:100%; max-width:640px; padding:14px 20px; border:3px solid var(--accent); border-radius:30px; font-size:1.1rem; background:var(--bg-card); color:var(--text-primary); outline:none; }
    .search-hero input:focus { border-color:#92400e; box-shadow:0 0 0 4px rgba(245,158,11,0.15); }
    .result-item { display:block; background:var(--bg-card); border:1px solid #fde68a; border-radius:8px; padding:14px 18px; margin-bottom:10px; text-decoration:none; color:inherit; transition:background 0.15s; }
    .result-item:hover { background:#fffdf5; }
    .result-meta { display:flex; gap:8px; align-items:center; font-size:0.75rem; color:var(--text-secondary); margin-bottom:4px; flex-wrap:wrap; }
    .badge-knowledge { background:#fef3c7; color:#92400e; padding:2px 8px; border-radius:10px; font-size:0.7rem; }
    .badge-question { background:#f0fdf4; color:#166534; padding:2px 8px; border-radius:10px; font-size:0.7rem; }
    .badge-glossary { background:#eff6ff; color:#1e40af; padding:2px 8px; border-radius:10px; font-size:0.7rem; }
    .badge-case { background:#fef2f2; color:#991b1b; padding:2px 8px; border-radius:10px; font-size:0.7rem; }
    .no-results { text-align:center; padding:48px; color:var(--text-secondary); }
  </style>
</head>
<body>

  <main style="max-width:800px;margin:0 auto;padding:24px;">
    <div class="search-hero">
      <h2 style="font-family:var(--font-display);color:var(--text-primary);margin-bottom:16px;">🔍 全文搜索</h2>
      <input type="text" id="search-input" placeholder="搜索知识点、题目、术语、案例..." autofocus oninput="doSearch()">
      <div style="margin-top:10px;font-size:0.78rem;color:var(--text-secondary);">多关键词搜索（空格分隔） · 已索引 <span id="index-count">0</span> 条内容</div>
    </div>
    <div id="results"></div>
  </main>

  <script src="../shared/js/storage.js"></script>
  <script src="../shared/js/router.js"></script>
  <script src="../subjects/econstats/data/knowledge.js"></script>
  <script src="../subjects/econstats/data/quiz.js"></script>
  <script src="../subjects/econstats/data/glossary.js"></script>
  <script src="../subjects/econstats/data/cases.js"></script>
  <script src="../subjects/stat-comp/data/knowledge.js"></script>
  <script src="../subjects/stat-comp/data/quiz.js"></script>
  <script src="../shared/js/search-engine.js"></script>
  <script>
    injectNavbar('search');

    // Build static index (always available)
    SearchEngine.buildIndex();
    document.getElementById('index-count').textContent = SearchEngine.index.length;

    // Debounced search
    var searchTimer = null;

    function doSearch() {
      var query = document.getElementById('search-input').value.trim();
      var container = document.getElementById('results');

      if (query.length === 0) {
        container.innerHTML = '<div class="no-results">输入关键词开始搜索...</div>';
        return;
      }

      // Show loading state
      container.innerHTML = '<div class="no-results">🔍 搜索中...</div>';

      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        doSearchInternal(query);
      }, 300);
    }

    function doSearchInternal(query) {
      var container = document.getElementById('results');

      // Static search
      var results = SearchEngine.search(query);
      if (results.length === 0) {
        container.innerHTML = '<div class="no-results">🔍 未找到结果 — 尝试其他关键词</div>';
        return;
      }
      renderSearchResults(results, query);
    }

    function renderSearchResults(results, query) {
      var container = document.getElementById('results');
      container.innerHTML = results.map(function (r) {
        var typeClass = 'badge-' + r.type;
        return '<a href="' + r.url + '" class="result-item">' +
          '<div class="result-meta">' +
            '<span class="' + typeClass + '">' + SearchEngine.getTypeLabel(r.type) + '</span>' +
            '<span>' + SearchEngine.getChapterTitle(r.chapter) + '</span>' +
            '<span style="margin-left:auto;">相关度：' + r.score + '</span>' +
          '</div>' +
          '<div style="font-weight:600;color:var(--text-primary);margin-bottom:4px;">' + highlightMatch(r.title, query) + '</div>' +
          '<div style="font-size:0.82rem;color:var(--text-secondary);line-height:1.5;">' + highlightMatch(r.snippet, query) + '...</div>' +
        '</a>';
      }).join('');
    }

    function highlightMatch(text, query) {
      if (!text) return '';
      var keywords = query.trim().split(/\s+/);
      var result = text;
      keywords.forEach(function(kw) {
        if (kw.length === 0) return;
        var escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var re = new RegExp('(' + escaped + ')', 'gi');
        result = result.replace(re, '<mark style="background:#fde68a;padding:1px 3px;border-radius:2px;">$1</mark>');
      });
      return result;
    }
  </script>
</body>
</html>
