<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习仪表盘 - Stat-Lab</title>
  <link rel="stylesheet" href="../shared/css/variables-warm.css">
  <link rel="stylesheet" href="../shared/css/variables-academic.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/pages.css">
  <link rel="stylesheet" href="../shared/css/responsive.css">
  <style>
    .dash-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
    .dash-card { background:var(--bg-card); border:2px dashed var(--border-dashed); border-radius:var(--radius); padding:20px; text-align:center; box-shadow:var(--shadow); }
    .dash-card .number { font-family:var(--font-display); font-size:2.2rem; color:var(--accent); font-weight:700; }
    .dash-card .label { font-size:0.82rem; color:var(--text-secondary); margin-top:4px; }
    .chapter-ring { display:inline-block; margin:10px 14px; text-align:center; }
    .chapter-ring svg { width:80px; height:80px; }
    .chapter-ring .ring-label { font-size:0.72rem; color:var(--text-secondary); margin-top:2px; }
    .error-mini { padding:10px 14px; border-left:3px solid var(--warning); background:#fef2f2; border-radius:0 8px 8px 0; margin-bottom:8px; font-size:0.85rem; cursor:pointer; }
    .heatmap { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; }
    .heatmap .day { width:32px; height:32px; border-radius:4px; background:#f5f0e0; position:relative; }
    .heatmap .day.studied { background:#f59e0b; opacity:0.75; }
    .heatmap .day .day-label { position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:0.6rem; color:var(--text-secondary); }
    .section-title { font-family:var(--font-display); color:var(--text-primary); margin-bottom:14px; }
    .subject-section { margin-bottom:8px; }
  </style>
</head>
<body>
  <div id="dash-content" style="max-width:1000px;margin:0 auto;padding:24px;"></div>

  <script src="../shared/js/storage.js"></script>
  <script src="../shared/js/router.js"></script>
  <script>
    injectNavbar('dashboard');

    function renderDashboard() {
      var stats = EcoStore.getStats();
      var totalErrors = EcoStore.getAllErrorCount();

      var container = document.getElementById('dash-content');
      var html = '';

      // Header
      html += '<div style="text-align:center;margin-bottom:28px;">' +
        '<h2 style="font-family:var(--font-display);font-size:1.5rem;color:var(--text-primary);margin:0;">📊 学习仪表盘</h2>' +
        '</div>';

      // Overview cards
      html += '<div class="dash-grid">' +
        '<div class="dash-card"><div class="number">' + stats.totalCompleted + '</div><div class="label">已做题数</div></div>' +
        '<div class="dash-card"><div class="number">' + stats.overallRate + '%</div><div class="label">总体正确率</div></div>' +
        '<div class="dash-card"><div class="number">' + totalErrors + '</div><div class="label">错题积累</div></div>' +
        '<div class="dash-card"><div class="number">' + stats.totalQuestions + '</div><div class="label">题库总量</div></div>' +
        '</div>';

      // Chapter progress rings - grouped by subject
      for (var s = 0; s < SUBJECT_REGISTRY.length; s++) {
        var subject = SUBJECT_REGISTRY[s];
        html += '<div style="background:var(--bg-card);border:2px dashed var(--border-dashed);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow);">' +
          '<h3 class="section-title" style="border-left:4px solid ' + subject.color + ';padding-left:10px;">' + subject.icon + ' ' + subject.name + '</h3>' +
          '<div style="display:flex;flex-wrap:wrap;justify-content:center;">';

        for (var c = 0; c < subject.chapters.length; c++) {
          var ch = subject.chapters[c];
          var progress = EcoStore.getProgress(subject.id, ch.id);
          var comp = progress.completed || 0;
          var tot = Math.max(progress.total || 50, comp || 1);
          var pct = comp > 0 ? Math.round((progress.correct || 0) / comp * 100) : 0;
          var color = pct >= 80 ? '#22c55e' : pct >= 60 ? '#f59e0b' : '#dc2626';
          var circ = 2 * Math.PI * 32;
          var dashoff = circ * (1 - comp / tot);
          if (dashoff < 0) dashoff = 0;
          html += '<a href="../subjects/' + subject.id + '/quiz/' + ch.id + '.html" style="text-decoration:none;color:inherit;">' +
            '<div class="chapter-ring">' +
              '<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="#f0f0f0" stroke-width="8"/>' +
              '<circle cx="40" cy="40" r="32" fill="none" stroke="' + color + '" stroke-width="8" stroke-dasharray="' + circ + '" stroke-dashoffset="' + dashoff + '" stroke-linecap="round" transform="rotate(-90 40 40)"/>' +
              '<text x="40" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">' + comp + '</text></svg>' +
              '<div class="ring-label">' + ch.icon + ' ' + ch.title + '<br>' + pct + '%</div>' +
            '</div></a>';
        }
        html += '</div></div>';
      }

      // Heatmap (7-day)
      var heatmap = EcoStore.getHeatmap(7);
      html += '<div style="background:var(--bg-card);border:2px dashed var(--border-dashed);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow);text-align:center;">' +
        '<h3 class="section-title">📅 近7天学习记录</h3>' +
        '<div class="heatmap">';
      var heatDates = Object.keys(heatmap).sort();
      for (var d = 0; d < 7; d++) {
        var date = new Date();
        date.setDate(date.getDate() - (6 - d));
        var dateStr = date.toISOString().split('T')[0];
        var dayCount = heatmap[dateStr] || 0;
        var dayLabel = ['日','一','二','三','四','五','六'][date.getDay()];
        html += '<div class="day' + (dayCount > 0 ? ' studied' : '') + '" title="' + dateStr + ': ' + dayCount + '题">' +
          '<div class="day-label">' + dayLabel + '</div></div>';
      }
      html += '</div></div>';

      // Recent errors - cross-subject
      html += '<div style="background:var(--bg-card);border:2px dashed var(--border-dashed);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);">' +
        '<h3 class="section-title">❌ 最近错题</h3>';
      if (totalErrors === 0) {
        html += '<p style="color:var(--text-secondary);text-align:center;">暂无错题，继续保持！🎉</p>';
      } else {
        var allErrors = [];
        for (var se = 0; se < SUBJECT_REGISTRY.length; se++) {
          var sid = SUBJECT_REGISTRY[se].id;
          for (var sc = 0; sc < SUBJECT_REGISTRY[se].chapters.length; sc++) {
            var chId = SUBJECT_REGISTRY[se].chapters[sc].id;
            var chapErrs = EcoStore.getErrors(sid, chId);
            for (var ei = 0; ei < chapErrs.length; ei++) {
              allErrors.push({ subjectId: sid, chapterId: chId, question: chapErrs[ei] });
            }
          }
        }
        allErrors.slice(-5).reverse().forEach(function(item) {
          var subj = null;
          for (var fi = 0; fi < SUBJECT_REGISTRY.length; fi++) {
            if (SUBJECT_REGISTRY[fi].id === item.subjectId) { subj = SUBJECT_REGISTRY[fi]; break; }
          }
          var chName = '';
          if (subj) {
            for (var fc = 0; fc < subj.chapters.length; fc++) {
              if (subj.chapters[fc].id === item.chapterId) { chName = subj.chapters[fc].title; break; }
            }
          }
          html += '<a href="../subjects/' + item.subjectId + '/quiz/' + item.chapterId + '.html" style="text-decoration:none;color:inherit;">' +
            '<div class="error-mini">' +
              '<span style="font-weight:600;">' + item.question.question.substring(0, 50) + '...</span>' +
              '<span style="color:#78716c;font-size:0.75rem;display:block;">' + (chName || item.chapterId) + ' · ' + (item.question.knowledgePoint || '') + '</span>' +
            '</div></a>';
        });
      }
      html += '</div>';

      container.innerHTML = html;
    }

    renderDashboard();
  </script>
</body>
</html>
